name: Fetch jobs

on:
  schedule:
    - cron: "50 0 * * *"   # 06:20 IST, before the Indeed refresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/fetch-jobs.yml"

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch jobs from feeds
        env:
          JSEARCH_KEY: ${{ secrets.JSEARCH_KEY }}
          JSEARCH_QUERIES: ${{ vars.JSEARCH_QUERIES || '6' }}
        run: python scripts/fetch_feeds.py
      - name: Commit feeds.json
        run: |
          git config user.name "soli-maps-bot"
          git config user.email "soli-maps-bot@users.noreply.github.com"
          git add feeds.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Feeds refresh $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
