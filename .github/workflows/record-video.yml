name: Record hero video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/record_video.py"
      - ".github/workflows/record-video.yml"

permissions:
  contents: write

concurrency:
  group: record-video
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and ffmpeg
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record the map
        run: python tools/record_video.py
      - name: Encode
        run: |
          set -e
          RAW=$(ls /tmp/rec/*.webm | head -1)
          S=$(cat /tmp/rec/start.txt); E=$(cat /tmp/rec/end.txt)
          D=$(python -c "print(round(float('$E')-float('$S'),2))")
          mkdir -p assets
          ffmpeg -y -loglevel error -ss "$S" -t "$D" -i "$RAW" -an -vf "fps=30,scale=1440:-2,format=yuv420p" -c:v libx264 -preset veryfast -crf 26 -movflags +faststart assets/hero.mp4
          ffmpeg -y -loglevel error -ss "$S" -t "$D" -i "$RAW" -an -vf "fps=30,scale=1440:-2" -c:v libvpx-vp9 -b:v 0 -crf 40 -row-mt 1 -deadline good -cpu-used 4 assets/hero.webm
          ffmpeg -y -loglevel error -ss 1.5 -i assets/hero.mp4 -frames:v 1 -q:v 3 assets/hero.jpg
          ls -la assets
      - name: Commit
        run: |
          git config user.name "Ritheesh"
          git config user.email "ritheesh@users.noreply.github.com"
          git add assets/hero.mp4 assets/hero.webm assets/hero.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Hero video $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
