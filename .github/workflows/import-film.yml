name: Import hero film

on:
  push:
    branches: [main]
    paths:
      - "tools/film_url.txt"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and encode
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL --fail -o /tmp/film.mp4 "$(head -1 tools/film_url.txt)"
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact /tmp/film.mp4
          mkdir -p assets
          ffmpeg -y -loglevel error -i /tmp/film.mp4 -an -vf "scale=-2:768,format=yuv420p" -c:v libx264 -preset veryfast -crf 22 -movflags +faststart assets/film.mp4
          ffmpeg -y -loglevel error -i /tmp/film.mp4 -an -vf "scale=-2:768" -c:v libvpx-vp9 -b:v 0 -crf 34 -row-mt 1 -deadline good -cpu-used 4 assets/film.webm
          ffmpeg -y -loglevel error -ss 0.3 -i assets/film.mp4 -frames:v 1 -q:v 3 assets/film.jpg
          ffmpeg -y -loglevel error -i assets/film.mp4 -vf "fps=1,scale=480:-2,tile=4x3" -frames:v 1 assets/film-sheet.jpg
          git rm -q tools/film_url.txt
          ls -la assets
      - name: Commit
        run: |
          git config user.name "Ritheesh"
          git config user.email "ritheesh@users.noreply.github.com"
          git add assets/film.mp4 assets/film.webm assets/film.jpg assets/film-sheet.jpg
          git commit -m "Hero film from Canva"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
