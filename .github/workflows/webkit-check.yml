name: iPhone Safari check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/webkit_check.py"
      - ".github/workflows/webkit-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps webkit
      - run: python tools/webkit_check.py
      - run: |
          git config user.name "Ritheesh"
          git config user.email "ritheesh@users.noreply.github.com"
          git add debug
          git commit -m "iPhone Safari check" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push && exit 0; sleep 5; done
