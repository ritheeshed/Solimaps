<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soli Maps product intro (render source)</title>
<!-- Rendered frame by frame by tools/intro/render.py: window.render(t) draws the frame at t seconds. -->
<style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Inter;src:url(fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Inter;src:url(fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:800px;overflow:hidden;background:#F4EEE8;font-family:Inter,sans-serif;color:#2B2022;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;opacity:0}
#foot{width:1600px;height:800px}
#aur{background:#FFF3EE;overflow:hidden}
#aur i{position:absolute;border-radius:50%;filter:blur(90px)}
#neu{background:#F4EEE8}
.abs{position:absolute}
.abs.layer{inset:auto}
/* glass search */
#search{left:340px;top:330px;width:920px;height:120px;border-radius:28px;background:rgba(255,255,255,.62);backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.85);box-shadow:0 30px 80px rgba(43,32,34,.18);display:flex;align-items:center;gap:26px;padding:0 40px}
.mark{flex:none;width:54px;height:54px;border-radius:50%;background:#E5484D;display:grid;place-items:center;box-shadow:0 6px 18px rgba(229,72,77,.35)}
.mark::after{content:"";width:18px;height:18px;border-radius:50%;background:#fff}
#q{font-size:44px;font-weight:500;letter-spacing:-.03em;white-space:nowrap}
#q .dim{color:#B5A8AA}
.caret{display:inline-block;width:3px;height:46px;background:#E5484D;vertical-align:-8px;margin-left:3px}
/* status labels */
.lab{display:flex;gap:22px;align-items:flex-start;font-size:27px;font-weight:500;letter-spacing:.02em;line-height:1.15;text-transform:uppercase}
.lab .dot{position:relative;width:16px;height:16px;border-radius:50%;background:#2B2022;margin-top:8px;flex:none}
.lab .dot b{position:absolute;inset:-12px;border-radius:50%;border:2px solid #2B2022}
.lab small{display:block;font-size:27px;color:#7d6a6e}
/* logo tiles + bubble */
.tile{width:150px;height:150px;border-radius:30px;background:#fff;box-shadow:0 14px 40px rgba(43,32,34,.12);display:grid;place-items:center}
.tile img{width:84px;height:84px;object-fit:contain}
#bubble{left:300px;top:470px;width:1000px;height:118px;border-radius:30px;background:rgba(255,255,255,.55);display:flex;align-items:center;gap:26px;padding:0 34px;box-shadow:0 10px 30px rgba(43,32,34,.06)}
#bubble .ai{flex:none;width:70px;height:70px;border-radius:50%;background:#E5484D;display:grid;place-items:center}
#btext{font-size:34px;font-weight:400;letter-spacing:-.02em;color:#5f4f52}
/* job cards */
.card{left:300px;width:1000px;height:170px;border-radius:34px;background:#fff;box-shadow:0 30px 80px rgba(43,32,34,.16);display:flex;align-items:center;gap:28px;padding:0 34px}
.card .lg{flex:none;width:100px;height:100px;border-radius:50%;background:#fff;border:1px solid #F0E4E2;display:grid;place-items:center}
.card .lg img{width:60px;height:60px;object-fit:contain}
.card h3{margin:0;font-size:34px;overflow:hidden;text-overflow:ellipsis;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.card p{margin:6px 0 0;font-size:24px;color:#86767A;white-space:nowrap}
.card .tx{flex:1;min-width:0}
.pill{flex:none;display:flex;align-items:center;gap:10px;height:64px;padding:0 24px;border-radius:20px;background:#E5484D;color:#fff;font-size:24px;font-weight:600}
.pill.soft{background:#FCE6E5;color:#CE3B40}
/* map overlay */
#pin{left:370px;top:150px;padding:18px 26px;border-radius:22px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(43,32,34,.25);font-size:24px;font-weight:500;display:flex;gap:14px;align-items:center;white-space:nowrap}
#pin i{width:14px;height:14px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 6px rgba(229,72,77,.25)}
/* apply */
#apply{left:300px;top:250px}
#abtn{left:0;right:0;margin:0 auto;width:max-content;top:470px;height:84px;border-radius:999px;background:#2B2022;color:#fff;font-size:28px;font-weight:500;display:flex;align-items:center;gap:14px;padding:0 36px;white-space:nowrap}
#cur{left:0;top:0;width:44px;height:44px}
#ring{width:80px;height:80px;border-radius:50%;border:3px solid #E5484D}
#done{left:0;right:0;margin:0 auto;width:max-content;top:470px;height:84px;border-radius:999px;background:#30A46C;color:#fff;font-size:28px;font-weight:500;display:flex;align-items:center;gap:14px;padding:0 36px;white-space:nowrap}
#end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
#end .logo{display:flex;align-items:center;gap:18px;font-size:64px;font-weight:600;letter-spacing:-.04em}
#end .logo .mark{width:64px;height:64px}
#end p{margin:0;font-size:34px;color:#86767A;letter-spacing:-.02em}
#end p em{font-style:normal;color:#E5484D}
</style>
</head>
<body>
<canvas id="foot" class="layer" width="1600" height="800"></canvas>
<div id="aur" class="layer"><i></i><i></i><i></i><i></i><i></i></div>
<div id="neu" class="layer"></div>

<div id="search" class="abs layer"><div class="mark"></div><div id="q"></div></div>

<div id="labs"></div>

<div id="tiles"></div>
<div id="bubble" class="abs layer"><div class="ai"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z" fill="#fff"/></svg></div><div id="btext"></div></div>

<div id="cards"></div>

<div id="pin" class="abs layer"><i></i><span id="pinT"></span></div>

<div id="apply" class="abs layer"></div>
<div id="abtn" class="abs layer"></div>
<div id="done" class="abs layer"><svg width="30" height="30" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="doneT"></span></div>
<div id="ring" class="abs layer"></div>
<svg id="cur" class="abs layer" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L9.6 19z" fill="#fff" stroke="#2B2022" stroke-width="1.6" stroke-linejoin="round"/></svg>

<div id="end" class="layer"><div class="logo"><span class="mark"></span>Soli Maps</div><p>Real jobs. <em>Real offices.</em> Straight from the company.</p></div>

<script>
/* DATA is injected by render.py: {query, pages, job:{t,c,place,logo}, job2:{...}, logos:[...], office, frames:{a:[...],b:[...]}} */
const D=window.DATA;
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const seg=(t,a,b,f=ease)=>f(clamp((t-a)/(b-a)));
const fade=(t,a,b,c,d)=>Math.min(seg(t,a,b),1-seg(t,c,d));   // in a→b, out c→d
const set=(el,o,y=0,s=1)=>{el.style.opacity=o;el.style.transform=`translateY(${y}px) scale(${s})`};

/* build the pieces */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const LABS=[[`Reading ${D.pages}`,'career pages',230,170],['Skipping','consultancy posts',1030,150],['Pinning','real offices',300,520],['Filtering',D.filter,1010,560]];
$('#labs').innerHTML=LABS.map(l=>`<div class="lab abs layer" style="left:${l[2]}px;top:${l[3]}px"><span class="dot"><b></b><b></b></span><span>${esc(l[0])}<small>${esc(l[1])}</small></span></div>`).join('');
$('#tiles').innerHTML=D.logos.map((l,i)=>`<div class="tile abs layer" style="left:${150+i*220}px;top:210px"><img src="../../${l}"></div>`).join('');
const cardHTML=(j,pill)=>`<div class="lg"><img src="../../${j.logo}"></div><div class="tx"><h3>${esc(j.t)}</h3><p>${esc(j.c)} · ${esc(j.place)}</p></div>${pill}`;
$('#cards').innerHTML=`<div class="card abs layer" id="c2" style="top:470px">${cardHTML(D.job2,'<span class="pill soft">Company careers</span>')}</div><div class="card abs layer" id="c1" style="top:270px">${cardHTML(D.job,'<span class="pill"><svg width="22" height="22" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Company careers</span>')}</div>`;
$('#apply').innerHTML=`<div class="card" style="position:relative;left:0;width:1000px">${cardHTML(D.job,'<span class="pill soft">Posted '+esc(D.job.when)+'</span>')}</div>`;
$('#abtn').innerHTML=`Apply on ${esc(D.job.c)} careers <svg width="26" height="26" viewBox="0 0 16 16"><path d="M5 11L11 5M6 5h5v5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`;
$('#doneT').textContent=`Opened ${D.job.host}`;
$('#pinT').textContent=D.office;

/* footage frames, preloaded */
const imgs={a:[],b:[]};
window.preload=()=>Promise.all(['a','b'].flatMap(k=>D.frames[k].map((src,i)=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=src;imgs[k][i]=im}))));
const ctx=$('#foot').getContext('2d');
function drawFoot(list,idx,blur,zoom){
  const im=list[Math.min(list.length-1,Math.max(0,idx))];if(!im||!im.naturalWidth)return;
  const s=Math.max(1600/im.naturalWidth,800/im.naturalHeight)*zoom,w=im.naturalWidth*s,h=im.naturalHeight*s;
  ctx.filter=blur?`blur(${blur}px)`:'none';ctx.clearRect(0,0,1600,800);ctx.drawImage(im,(1600-w)/2,(800-h)/2,w,h);
}

/* timeline (seconds) */
const T={s1:[0,3.4],s2:[3.4,7.6],s3:[7.6,11.2],s4:[11.2,14.6],s5:[14.6,18.2],s6:[18.2,21.6],end:[21.6,24]};
window.DURATION=24;
window.render=t=>{
  // backgrounds
  const fA=fade(t,0,.4,3.0,3.7), fB=fade(t,14.4,15.0,17.9,18.5);
  const foot=$('#foot');
  if(fA>0){drawFoot(imgs.a,Math.round(t*30),fade(t,-1,0,1.6,2.0)*0+seg(t,1.2,2.6)*3,1+seg(t,0,3.4,x=>x)*.04);foot.style.opacity=fA}
  else if(fB>0){drawFoot(imgs.b,Math.round((t-14.4)*30),0,1.04+seg(t,14.4,18.4,x=>x)*.05);foot.style.opacity=fB}
  else foot.style.opacity=0;
  const aur=fade(t,2.9,3.7,7.2,7.9)+fade(t,10.9,11.6,14.4,15.0);
  $('#aur').style.opacity=clamp(aur);
  [...$('#aur').children].forEach((b,i)=>{const p=[['#E5484D',.55,520],['#FF9F8A',.7,620],['#FFD6C2',.9,700],['#C9E4F0',.55,520],['#FCE6E5',.9,640]][i];
    const x=[260,980,560,1240,120][i]+Math.sin(t*.55+i*1.7)*140, y=[120,60,420,380,520][i]+Math.cos(t*.45+i*2.1)*90;
    b.style.cssText=`left:${x-p[2]/2}px;top:${y-p[2]/2}px;width:${p[2]}px;height:${p[2]}px;background:${p[0]};opacity:${p[1]}`});
  $('#neu').style.opacity=clamp(fade(t,7.2,7.9,10.9,11.6)+fade(t,17.9,18.5,30,31));

  // s1: glass search typing over the real map
  const so=fade(t,.25,.9,3.0,3.5);set($('#search'),so,(1-seg(t,.25,.9,out))*24,1-seg(t,3.0,3.5)*.04);
  const full=D.query,n=Math.floor(seg(t,.9,2.6,x=>x)*full.length);
  $('#q').innerHTML=esc(full.slice(0,n))+(t<2.9&&Math.floor(t*2.4)%2===0||n<full.length?'<span class="caret"></span>':'')+(n===0?'<span class="dim">Find jobs…</span>':'');

  // s2: status labels on the colour wash
  [...document.querySelectorAll('.lab')].forEach((el,i)=>{const a=3.9+i*.6;const o=fade(t,a,a+.5,7.0,7.5);
    el.style.opacity=o;el.style.transform=`translateY(${(1-seg(t,a,a+.5,out))*18}px)`;
    const doneA=a+1.4,dim=seg(t,doneA,doneA+.4);el.style.color=`rgba(43,32,34,${1-dim*.55})`;
    el.querySelectorAll('b').forEach((r,k)=>{const ph=((t-a)*1.1+k*.5)%1;r.style.transform=`scale(${.6+ph*1.4})`;r.style.opacity=t>a&&t<doneA?(1-ph)*.6:0})});

  // s3: logo tiles slide in, then the reply bubble types
  [...document.querySelectorAll('.tile')].forEach((el,i)=>{const a=7.9+i*.12;const o=fade(t,a,a+.45,10.8,11.3);
    el.style.opacity=o;el.style.transform=`translateX(${(1-seg(t,a,a+.6,out))*-120}px) scale(${i===0?1+seg(t,9.6,10.1)*.06:1})`;
    el.style.filter=i>2?`grayscale(${seg(t,9.6,10.2)})`:'none';el.style.opacity=o*(i>2?1-seg(t,9.6,10.2)*.45:1)});
  const bo=fade(t,8.6,9.1,10.8,11.3);set($('#bubble'),bo,(1-seg(t,8.6,9.1,out))*20);
  const msg=D.reply,m=Math.floor(seg(t,9.0,10.4,x=>x)*msg.length);$('#btext').textContent=msg.slice(0,m);

  // s4: job cards rise on the colour wash
  set($('#c1'),fade(t,11.5,12.1,14.2,14.7),(1-seg(t,11.5,12.2,out))*80,1+seg(t,13.4,14.0)*.03);
  set($('#c2'),fade(t,11.9,12.5,14.2,14.7)*.92,(1-seg(t,11.9,12.6,out))*80,.97);

  // s5: the real 3D map flying to the office
  set($('#pin'),fade(t,15.6,16.1,17.8,18.2),(1-seg(t,15.6,16.2,out))*16);

  // s6: apply on the company's own site
  set($('#apply'),fade(t,18.4,18.9,21.2,21.6),(1-seg(t,18.4,19.0,out))*30);
  const press=seg(t,20.0,20.15)-seg(t,20.15,20.35);
  set($('#abtn'),fade(t,18.7,19.2,20.25,20.45),(1-seg(t,18.7,19.3,out))*24,1-press*.05);
  set($('#done'),fade(t,20.35,20.6,21.2,21.6),0,.9+seg(t,20.35,20.6,out)*.1);
  const cx=1180-seg(t,19.1,19.95)*330,cy=720-seg(t,19.1,19.95)*200;
  const cur=$('#cur');cur.style.opacity=fade(t,19.0,19.3,20.8,21.1);cur.style.left=cx+'px';cur.style.top=cy+'px';
  const r=$('#ring');const rp=seg(t,20.0,20.5,out);r.style.opacity=t>20&&t<20.5?(1-rp):0;r.style.left=(cx-38)+'px';r.style.top=(cy-38)+'px';r.style.transform=`scale(${.3+rp})`;

  // end card
  const e=fade(t,21.5,22.0,23.4,24);$('#end').style.opacity=e;$('#end').style.transform=`scale(${.97+seg(t,21.5,22.2,out)*.03})`;
  $('#neu').style.opacity=Math.max(+$('#neu').style.opacity,e);
};
</script>
</body>
</html>
